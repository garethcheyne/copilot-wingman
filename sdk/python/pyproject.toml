[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wingman-sdk"
version = "0.1.0"
description = "Official Python SDK for the Wingman chat proxy"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Wingman" }]
dependencies = [
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/garethcheyne/copilot-wingman"

[tool.hatch.build.targets.wheel]
packages = ["src/wingman"]
