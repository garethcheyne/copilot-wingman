<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wingman API · Swagger UI</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        color: #e6e6e6;
        font-family:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
      }
      /* Tint Swagger UI to fit the dark Wingman shell */
      .swagger-ui,
      .swagger-ui .info .title,
      .swagger-ui .opblock-tag,
      .swagger-ui .opblock .opblock-summary-description,
      .swagger-ui .opblock-description-wrapper p,
      .swagger-ui table thead tr th,
      .swagger-ui .response-col_status,
      .swagger-ui .response-col_links,
      .swagger-ui .model .property,
      .swagger-ui .model-title,
      .swagger-ui label,
      .swagger-ui .opblock .opblock-section-header h4,
      .swagger-ui .parameter__name,
      .swagger-ui .parameter__type,
      .swagger-ui .parameter__deprecated,
      .swagger-ui .tab li,
      .swagger-ui .scheme-container,
      .swagger-ui .scheme-container .schemes-title {
        color: #e6e6e6 !important;
      }
      .swagger-ui .scheme-container {
        background: rgba(20, 22, 28, 0.4);
        border-radius: 12px;
        box-shadow: none;
      }
      .swagger-ui .opblock-tag {
        border-bottom-color: rgba(255, 255, 255, 0.08);
      }
      .swagger-ui .opblock {
        background: rgba(20, 22, 28, 0.5);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .swagger-ui .opblock .opblock-summary {
        border-color: rgba(255, 255, 255, 0.08);
      }
      .swagger-ui .opblock-body pre.microlight {
        background: #0e1015 !important;
        color: #e6e6e6 !important;
      }
      .swagger-ui .btn {
        color: #e6e6e6;
        border-color: rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.03);
      }
      .swagger-ui select,
      .swagger-ui input[type="text"],
      .swagger-ui textarea {
        background: rgba(20, 22, 28, 0.6);
        color: #e6e6e6;
        border-color: rgba(255, 255, 255, 0.14);
      }
      .swagger-ui .topbar {
        display: none;
      }
      .swagger-ui .info {
        margin-top: 1rem;
      }
      .loading-fallback {
        padding: 2rem;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div id="swagger-ui">
      <p class="loading-fallback">
        Loading Swagger UI from CDN…<br />
        If this stays visible, your browser is offline and cannot reach
        unpkg.com — open <code>/openapi.json</code> directly to view the spec.
      </p>
    </div>
    <script
      src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"
      crossorigin
    ></script>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var url = params.get("url") || "/openapi.json";
        if (!window.SwaggerUIBundle) {
          // CDN failed — leave the fallback message visible
          return;
        }
        window.SwaggerUIBundle({
          url: url,
          dom_id: "#swagger-ui",
          deepLinking: true,
          docExpansion: "list",
          defaultModelsExpandDepth: 0,
          tryItOutEnabled: true,
          syntaxHighlight: { theme: "obsidian" },
          persistAuthorization: true,
        });
      })();
    </script>
  </body>
</html>
