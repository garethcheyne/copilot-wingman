name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [proxy, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.project }}

      - name: Lint
        run: npm run lint --if-present
        working-directory: ${{ matrix.project }}

      - name: Build
        run: npm run build
        working-directory: ${{ matrix.project }}
        env:
          NEXT_PUBLIC_PROXY_URL: http://localhost:3200
          NEXT_PUBLIC_API_KEY: test-key

  test:
    runs-on: ubuntu-latest
    needs: lint-and-build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wingman
          POSTGRES_PASSWORD: password
          POSTGRES_DB: wingman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wingman -d wingman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proxy/package-lock.json

      - name: Install proxy dependencies
        run: npm ci
        working-directory: proxy

      - name: Build proxy
        run: npm run build
        working-directory: proxy

      - name: Init database schema
        run: psql -f proxy/src/db/schema.sql
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: wingman
          PGPASSWORD: password
          PGDATABASE: wingman

      - name: Smoke test – proxy starts cleanly
        run: |
          timeout 5 node dist/server.js &
          sleep 2
          curl -sf http://localhost:3200/health || echo "No /health endpoint yet — build verified"
          kill %1 2>/dev/null || true
        working-directory: proxy
        env:
          DATABASE_URL: postgresql://wingman:password@localhost:5432/wingman
          INTERNAL_API_KEY: ci-test-key
          ENCRYPTION_KEY: 7b7d448727336b9ddf29be9c70e9ae04
          GITHUB_TOKEN_CMD: "echo skip"

  sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [node, python, dotnet]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: matrix.sdk == 'node'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json

      - name: Build Node SDK
        if: matrix.sdk == 'node'
        run: |
          npm ci
          npm run build
        working-directory: sdk/node

      - uses: actions/setup-python@v5
        if: matrix.sdk == 'python'
        with:
          python-version: "3.11"

      - name: Build Python SDK
        if: matrix.sdk == 'python'
        run: |
          python -m pip install --upgrade pip build
          python -m build
        working-directory: sdk/python

      - uses: actions/setup-dotnet@v4
        if: matrix.sdk == 'dotnet'
        with:
          dotnet-version: "8.0.x"

      - name: Build .NET SDK
        if: matrix.sdk == 'dotnet'
        run: dotnet build -c Release
        working-directory: sdk/dotnet/src/Wingman.Sdk

  docker:
    runs-on: ubuntu-latest
    needs: [test, sdk]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if VERSION changed
        id: version_check
        run: |
          if git diff HEAD~1 --name-only | grep -q '^VERSION$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push proxy image
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/proxy:latest
            ghcr.io/${{ github.repository }}/proxy:${{ steps.version.outputs.version }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          build-args: |
            NEXT_PUBLIC_PROXY_URL=http://localhost:3200
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ steps.version.outputs.version }}

      - name: Create tag and GitHub Release
        if: steps.version_check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Wingman v${{ steps.version.outputs.version }}"
          generate_release_notes: true

  sdk-release:
    runs-on: ubuntu-latest
    needs: sdk
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        sdk: [node, python, dotnet]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need all tags for version comparison

      - name: Read SDK version
        id: ver
        run: |
          set -euo pipefail
          case "${{ matrix.sdk }}" in
            node)
              v=$(node -p "require('./sdk/node/package.json').version")
              ;;
            python)
              v=$(grep -E '^version *= *"' sdk/python/pyproject.toml | head -1 \
                  | sed -E 's/^version *= *"([^"]+)".*/\1/')
              ;;
            dotnet)
              v=$(grep -oE '<Version>[^<]+</Version>' sdk/dotnet/src/Wingman.Sdk/Wingman.Sdk.csproj \
                  | head -1 | sed -E 's#</?Version>##g')
              ;;
          esac
          if [[ -z "$v" ]]; then
            echo "Could not read version for ${{ matrix.sdk }}" >&2
            exit 1
          fi
          tag="sdk-${{ matrix.sdk }}-v${v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "SDK ${{ matrix.sdk }} version: $v  (candidate tag: $tag)"

      - name: Check if tag already exists
        id: tagcheck
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${{ steps.ver.outputs.tag }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.ver.outputs.tag }} already exists — skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.ver.outputs.tag }} not found — will release."
          fi

      - uses: actions/setup-node@v4
        if: steps.tagcheck.outputs.exists == 'false' && matrix.sdk == 'node'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json

      - name: Pack Node SDK
        if: steps.tagcheck.outputs.exists == 'false' && matrix.sdk == 'node'
        run: |
          set -euo pipefail
          mkdir -p ../../sdk-artifacts
          npm ci
          npm run build
          npm pack
          mv ./*.tgz ../../sdk-artifacts/
        working-directory: sdk/node

      - uses: actions/setup-python@v5
        if: steps.tagcheck.outputs.exists == 'false' && matrix.sdk == 'python'
        with:
          python-version: "3.11"

      - name: Pack Python SDK
        if: steps.tagcheck.outputs.exists == 'false' && matrix.sdk == 'python'
        run: |
          set -euo pipefail
          mkdir -p ../../sdk-artifacts
          python -m pip install --upgrade pip build
          python -m build
          mv dist/* ../../sdk-artifacts/
        working-directory: sdk/python

      - uses: actions/setup-dotnet@v4
        if: steps.tagcheck.outputs.exists == 'false' && matrix.sdk == 'dotnet'
        with:
          dotnet-version: "8.0.x"

      - name: Pack .NET SDK
        if: steps.tagcheck.outputs.exists == 'false' && matrix.sdk == 'dotnet'
        run: |
          set -euo pipefail
          mkdir -p sdk-artifacts
          dotnet pack sdk/dotnet/src/Wingman.Sdk/Wingman.Sdk.csproj \
            -c Release -o sdk-artifacts

      - name: List artifacts
        if: steps.tagcheck.outputs.exists == 'false'
        run: ls -l sdk-artifacts

      - name: Create per-SDK GitHub Release
        if: steps.tagcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Wingman ${{ matrix.sdk }} SDK v${{ steps.ver.outputs.version }}"
          generate_release_notes: true
          files: sdk-artifacts/*
