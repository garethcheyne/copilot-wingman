name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [proxy, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.project }}

      - name: Lint
        run: npm run lint --if-present
        working-directory: ${{ matrix.project }}

      - name: Build
        run: npm run build
        working-directory: ${{ matrix.project }}
        env:
          NEXT_PUBLIC_PROXY_URL: http://localhost:3200
          NEXT_PUBLIC_API_KEY: test-key

  test:
    runs-on: ubuntu-latest
    needs: lint-and-build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wingman
          POSTGRES_PASSWORD: password
          POSTGRES_DB: wingman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wingman -d wingman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proxy/package-lock.json

      - name: Install proxy dependencies
        run: npm ci
        working-directory: proxy

      - name: Build proxy
        run: npm run build
        working-directory: proxy

      - name: Init database schema
        run: psql -f proxy/src/db/schema.sql
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: wingman
          PGPASSWORD: password
          PGDATABASE: wingman

      - name: Run integration tests
        run: npx tsx ../tests/api-keys.test.ts
        working-directory: proxy
        env:
          DATABASE_URL: postgresql://wingman:password@localhost:5432/wingman
          INTERNAL_API_KEY: ci-test-key
          ENCRYPTION_KEY: 7b7d448727336b9ddf29be9c70e9ae04

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if VERSION changed
        id: version_check
        run: |
          if git diff HEAD~1 --name-only | grep -q '^VERSION$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push proxy image
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/proxy:latest
            ghcr.io/${{ github.repository }}/proxy:${{ steps.version.outputs.version }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          build-args: |
            NEXT_PUBLIC_PROXY_URL=http://localhost:3200
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ steps.version.outputs.version }}

      - name: Create tag and GitHub Release
        if: steps.version_check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Wingman v${{ steps.version.outputs.version }}"
          generate_release_notes: true
